<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ruffle Test</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    ruffle-player { width: 800px; height: 600px; max-width: 100%; }
    p { color: #aaa; font-family: sans-serif; margin: 10px 0; font-size: 14px; }
  </style>
</head>
<body>
  <p id="status">Loading Ruffle...</p>
  <ruffle-player id="player" src="games/Epic Battle Fantasy 3.swf"></ruffle-player>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
  </script>
  <script src="ruffle/ruffle.js"></script>
  <script>
    const status = document.getElementById('status');

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = '800px';
        player.style.height = '600px';
        document.body.appendChild(player);
        player.ruffle().load('game/Epic Battle Fantasy 3.swf');
        status.textContent = '✅ Player created, loading game...';
      } catch(e) {
        status.textContent = '❌ Error: ' + e.message;
      }
    });
  </script>
</body>
</html>
