<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playing... | Epic Battle Fantasy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0d0d1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .back {
      color: #ffd700;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.2);
      transition: background 0.2s;
    }

    .back:hover { background: rgba(255,215,0,0.2); }

    h1 { font-size: 1rem; font-weight: 600; color: #ccc; }

    .controls { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      color: #ddd;
      transition: background 0.2s;
    }

    .btn:hover { background: rgba(255,255,255,0.15); }

    .btn-fs { background: rgba(64,196,255,0.15); color: #40c4ff; }

    /* Game stage */
    #stage {
      flex: 1;
      position: relative;
      background: #050510;
      overflow: hidden;
      min-height: 0;
    }

    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #game-container > * {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0d0d1a;
      z-index: 10;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,215,0,0.15);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p { color: #888; font-size: 0.85rem; }

    /* Progress bar */
    #progress-wrap {
      width: 240px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    #progress-pct {
      font-size: 0.75rem;
      color: #ffd700;
      font-weight: 700;
    }

    /* Error overlay */
    #error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1a0505;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    #error h2 { color: #ff6b6b; }
    #error p { color: #aaa; font-size: 0.9rem; }

    /* Hint for mobile */
    #hint {
      text-align: center;
      padding: 8px;
      font-size: 0.72rem;
      color: #555;
      background: rgba(255,255,255,0.02);
    }
  </style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Back</a>
  <h1 id="game-title">Loading...</h1>
  <div class="controls">
    <button class="btn" id="btn-restart" title="Reload game">↻ Restart</button>
    <button class="btn btn-fs" id="btn-fullscreen" title="Fullscreen">⛶ Fullscreen</button>
  </div>
</header>

<div id="stage">
  <div id="game-container"></div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Initializing Ruffle emulator...</p>
    <p id="load-status">Loading...</p>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <p id="progress-pct"></p>
  </div>

  <div id="error">
    <h2>⚠ Failed to load game</h2>
    <p id="error-msg">Unknown error</p>
  </div>
</div>

<div id="hint">💡 Tip: On mobile, use fullscreen for best experience. Saves are stored in your browser.</div>

<script>
  window.RufflePlayer = window.RufflePlayer || {};
</script>
<script src="ruffle/ruffle.js"></script>
<script>
(function() {
  'use strict';

  const GAME_FILES = {
    'ebf1':       { path: 'game/Epic Battle Fantasy.swf',    title: 'Epic Battle Fantasy' },
    'ebf2':       { path: 'game/Epic Battle Fantasy 2.swf',  title: 'Epic Battle Fantasy 2' },
    'ebf3':       { path: 'game/Epic Battle Fantasy 3.swf',  title: 'Epic Battle Fantasy 3' },
    'ebf4':       { path: 'game/Epic Battle Fantasy 4.swf',  title: 'Epic Battle Fantasy 4' },
    'ebf5':       { path: 'game/Epic Battle Fantasy 5.swf',  title: 'Epic Battle Fantasy 5' },
    'adventure':  { path: 'game/Adventure Story.swf',        title: 'Adventure Story' },
    'brawl':      { path: 'game/Brawl Royale.swf',           title: 'Brawl Royale' },
    'bullet':     { path: 'game/Bullet Heaven.swf',          title: 'Bullet Heaven' },
    'catcafe':    { path: 'game/Cat Cafe.swf',               title: 'Cat Cafe' },
    'mecha':      { path: 'game/Mecha Dress Up Game.swf',    title: 'Mecha Dress Up Game' },
    'monster':    { path: 'game/Monster Book.swf',           title: 'Monster Book' },
    'sketchbook': { path: 'game/Sketchbook.swf',             title: 'Sketchbook' },
    'kitten':     { path: 'game/The Kitten Game.swf',        title: 'The Kitten Game' },
  };

  const params = new URLSearchParams(window.location.search);
  const gameKey = params.get('game') || 'ebf3';
  const game = GAME_FILES[gameKey];

  if (!game) {
    showError('Game not found: ' + gameKey);
    return;
  }

  document.title = game.title + ' | Epic Battle Fantasy';
  document.getElementById('game-title').textContent = game.title;
  document.getElementById('load-status').textContent = 'Loading ' + game.title + '...';

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';

      const container = document.getElementById('game-container');
      container.appendChild(player);

      // Fetch SWF với progress bar
      const statusEl = document.getElementById('load-status');
      const pctEl = document.getElementById('progress-pct');
      const barEl = document.getElementById('progress-bar');
      document.getElementById('progress-wrap').style.display = 'block';

      const resp = await fetch(game.path);
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status + ' khi tải ' + game.path);
      }

      const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
      let received = 0;
      let swfData;

      if (resp.body && total > 0) {
        const reader = resp.body.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          const pct = Math.min(99, Math.round(received / total * 100));
          barEl.style.width = pct + '%';
          pctEl.textContent = pct + '% — ' + (received / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
        }
        // Ghép các chunks thành 1 ArrayBuffer
        const merged = new Uint8Array(received);
        let offset = 0;
        for (const c of chunks) {
          merged.set(c, offset);
          offset += c.length;
        }
        swfData = merged.buffer;
        barEl.style.width = '100%';
        pctEl.textContent = '100% — đang khởi động game...';
      } else {
        // Fallback: không có stream/total
        swfData = await resp.arrayBuffer();
        barEl.style.width = '100%';
        pctEl.textContent = 'Đã tải xong, đang khởi động...';
      }

      player.ruffle().load({
        data: swfData,
        autoplay: 'on',
        letterbox: 'on',
        scale: 'showAll',
        contextMenu: 'off',
        unmuteOverlay: 'visible',
        warnOnUnsupportedContent: false,
      }).then(() => {
        hideLoading();
      }).catch(err => {
        showError('Game failed to load: ' + (err && err.message ? err.message : err));
      });

      // Fallback ẩn loading sau 30s (game nặng load lâu)
      setTimeout(hideLoading, 30000);

    } catch (err) {
      showError('Failed to start player: ' + err.message);
    }
  });

  function hideLoading() {
    const l = document.getElementById('loading');
    if (l) {
      l.style.opacity = '0';
      setTimeout(() => l.remove(), 500);
    }
  }

  function showError(msg) {
    document.getElementById('loading')?.remove();
    const e = document.getElementById('error');
    document.getElementById('error-msg').textContent = msg;
    e.style.display = 'flex';
  }

  // Fullscreen button
  document.getElementById('btn-fullscreen').addEventListener('click', () => {
    const stage = document.getElementById('stage');
    if (!document.fullscreenElement) {
      stage.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  // Restart button
  document.getElementById('btn-restart').addEventListener('click', () => {
    location.reload();
  });

})();
</script>

</body>
</html>
